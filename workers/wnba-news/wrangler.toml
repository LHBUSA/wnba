name = "wnba-news"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

# Independent WNBA newsroom lane: its own Worker, KV namespace and cron.
[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "NEWS_KV"
id = "c35ed1b81eda4e939c21dfcd831664d9"

# Reads structured WNBA records (rosters, injuries ledger, box scores) for
# entity linking and PBE Desk stories. If wnba-api is down, external news keeps
# flowing from the last-good entity dictionary; Desk stories pause.
[[services]]
binding = "API"
service = "wnba-api"

[observability]
enabled = true

# Secrets:
#   ADMIN_TOKEN                                    POST /run
#   SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY       after approval
#   YOUTUBE_API_KEY                                optional. With it the video lane uses
#     YouTube Data API v3 (uploads playlist -> playlistItems.list -> videos.list) and gets
#     duration, live state and status.embeddable straight from the provider. Without it the
#     lane runs the public Atom feed + per-video oEmbed path: a real path, not a stub, but
#     duration_sec stays null and live_broadcast_state stays 'unknown'. Either way nothing
#     publishes unless the video is proved embeddable, and only allowlisted channels are polled.

# Article passes parse several box scores per run.
[limits]
cpu_ms = 120000

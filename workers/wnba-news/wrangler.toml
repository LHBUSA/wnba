name = "wnba-news"
main = "src/index-live.js"
compatibility_date = "2026-09-01"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

# Independent WNBA newsroom lane: its own Worker, KV namespace and cron.
[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "NEWS_KV"
id = "c35ed1b81eda4e939c21dfcd831664d9"

# Reads structured WNBA records (rosters, injuries ledger, box scores) for
# entity linking and PBE Desk stories. If wnba-api is down, external news keeps
# flowing from the last-good entity dictionary; Desk stories pause.
[[services]]
binding = "API"
service = "wnba-api"

# International desk (medal-game results). If wnba-international is down, the WNBA newsroom is unaffected.
[[services]]
binding = "INTL"
service = "wnba-international"

# OpenAI governance (src/openai-cost.js). The org's complimentary data-sharing allowance is a SHARED pool (Soccer and
# other eligible traffic draw on it); WNBA keeps its own soft cap well below it. Nominal $ is an emergency ceiling only.
[vars]
OPENAI_SHARED_DAILY_TOKEN_ALLOWANCE = "1000000"
WNBA_OPENAI_DAILY_TOKEN_SOFT_CAP = "400000"
WNBA_OPENAI_DAILY_TOKEN_WARN = "350000"

[observability]
enabled = true

# Secrets: ADMIN_TOKEN (POST /run), SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (after approval)

# Article passes parse several box scores per run.
[limits]
cpu_ms = 120000

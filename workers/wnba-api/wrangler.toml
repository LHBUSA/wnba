name = "wnba-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

# Public read API for wnba.propbetedge.ai. No cron: user reads only.
# Provider mediation (ESPN) with edge cache + KV last-good; market data is read
# from snapshots written by wnba-ingest (user traffic never spends odds credits).

[[kv_namespaces]]
binding = "WNBA_KV"
id = "c3249a8e3552438da38c6cad0d54e172"

[vars]
# Payments stay fail-closed until every billing canary passes (docs/PAYWALL.md).
WNBA_PURCHASE_ACTIVE = "false"

[observability]
enabled = true

# Secrets for /v1/account (all three required before any visitor can reach the
# `pro` state; any one missing keeps the route fail-closed):
#   PBE_SESSION_JWT_SECRET   the MAGIC_JWT_SECRET of propbetedge-auth-magic. Used only
#                            to VERIFY the pbe_session cookie; this Worker never issues
#                            a session and never writes an entitlement.
#   SUPABASE_URL             https://rlfyavnhbngwbldebrid.supabase.co (entitlement ledger)
#   SUPABASE_SERVICE_ROLE_KEY  service role; pbe_has_sport_entitlement is service-role only.
#
# The session cookie is scoped Domain=.propbetedge.ai, so /v1/account only ever receives
# it when this Worker is reached on a propbetedge.ai host. On workers.dev the route is
# correct but permanently signed_out. See docs/PAYWALL.md gate 15.

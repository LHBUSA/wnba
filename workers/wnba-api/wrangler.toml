name = "wnba-api"
main = "src/index-premium.js"
compatibility_date = "2026-09-01"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

# Credentialed surfaces (WNBA session cookie) answer on a propbetedge.ai host; public reads keep workers.dev.
routes = [{ pattern = "wnba-api.propbetedge.ai", custom_domain = true }]

# Public read API for wnba.propbetedge.ai. No cron: user reads only.
# Provider mediation (ESPN) with edge cache + KV last-good; market data is read
# from snapshots written by WNBA Cloudflare Workers (user traffic never spends odds credits).

[[kv_namespaces]]
binding = "WNBA_KV"
id = "c3249a8e3552438da38c6cad0d54e172"

[[services]]
binding = "BILLING"
service = "propbetedge-sports-billing"

[[send_email]]
name = "EMAIL"

[vars]
WNBA_PURCHASE_ACTIVE = "true"
AUTH_FROM = "signin@mail.wnba.propbetedge.ai"
AUTH_PUBLIC_BASE = "https://wnba-api.propbetedge.ai"
PBE_PUBLISH = "true"
# Player photo providers (workers/wnba-api/src/photos.js). WNBA/ESPN are hotlinked
# external_editorial headshots; Commons is the licensed fallback; avatar = initials.
WNBA_PHOTO_PROVIDER_ORDER = "wnba,espn,commons,avatar"
WNBA_ENABLE_WNBA_CDN = "true"
WNBA_ENABLE_ESPN_HEADSHOTS = "true"
WNBA_ENABLE_COMMONS = "true"

[observability]
enabled = true

# Secrets:
#   WNBA_SESSION_SECRET
#   ENTITLEMENT_READ_TOKEN
#   WNBA_OWNER_EMAILS
#   PBE_SUPABASE_URL, PBE_SUPABASE_SERVICE_ROLE_KEY

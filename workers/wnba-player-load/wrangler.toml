name = "wnba-player-load"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

# Cloudflare Cron only. Wake every minute so first-deploy bootstrap and failed
# refreshes recover quickly; the Worker recomputes only when the shared-KV
# snapshot is at least 15 minutes old.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "WNBA_KV"
id = "c3249a8e3552438da38c6cad0d54e172"

[observability]
enabled = true
